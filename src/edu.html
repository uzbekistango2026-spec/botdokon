<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Education Platform</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--n:#0F1E3D;--ink:#0B1220;--a:#2F6BFF;--a2:#EEF3FF;--bg:#F4F5F7;--t:#0B1220;--t2:#5B6474;--t3:#98A1B0;--line:#E6E8EC;--ok:#0E9F6E;--bad:#E02D3C;--warn:#C27803}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--t);font-family:Geist,Inter,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#view{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.fade{animation:fd .35s cubic-bezier(.16,1,.3,1)}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace;letter-spacing:0;font-feature-settings:normal}
/* header */
.hd{background:var(--n);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 64px;position:relative;overflow:hidden}
.hd:after,.login:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.hd>*{position:relative;z-index:1}
.hd .top{display:flex;align-items:center;gap:10px}
.hd .lg{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--n);display:grid;place-items:center;font-weight:700;font-size:12px;overflow:hidden}
.hd .lg img{width:100%;height:100%;object-fit:cover}
.hd .cn{flex:1;font-weight:600;font-size:14px;color:#fff;letter-spacing:-.1px}
.hd .bell{width:34px;height:34px;border-radius:10px;border:1px solid #ffffff22;display:grid;place-items:center;color:#D5DCEA}
.hd .eyb{display:flex;align-items:center;gap:8px;margin-top:26px;font-size:12px;font-weight:500;color:#9FB0CF;letter-spacing:.2px;text-transform:uppercase}
.hd .eyb i{width:6px;height:6px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px #4ADE8026}
.hd h1{font-size:28px;font-weight:600;letter-spacing:-.9px;margin-top:6px;line-height:1.1}
.hd p{color:#AEBBD3;font-weight:400;font-size:14px;margin-top:6px}
.wrap{margin-top:-40px;position:relative;z-index:2;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--line);margin-bottom:10px}
.card h3{font-size:13px;font-weight:600;color:var(--t2);letter-spacing:.2px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.card h3 .tag{text-transform:none}
.stats{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.st{padding:16px;display:flex;flex-direction:column;gap:4px;text-align:left;align-items:flex-start;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .2s}
.st:nth-child(2n){border-right:0}.st:nth-child(n+3){border-bottom:0}.st:active{background:#F8F9FB}
.st small{color:var(--t2);font-weight:500;font-size:12.5px;display:flex;align-items:center;gap:6px}
.st small svg{color:var(--t3)}
.st b{font-size:30px;font-weight:600;letter-spacing:-1.2px;line-height:1.1}
.st b em{font-style:normal;font-size:15px;color:var(--t3);font-weight:500;letter-spacing:0}
.les{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.les:first-of-type{border-top:0}
.les .tm{width:52px;flex:0 0 52px;font-weight:600;font-size:15px;letter-spacing:-.3px}.les .tm small{display:block;color:var(--t3);font-weight:500;font-size:12px;letter-spacing:0}
.les .bar{width:2px;align-self:stretch;border-radius:2px;background:var(--n)}
.les .in{flex:1;min-width:0}.les .in b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px}.les .in small{color:var(--t2);font-size:13px}
.empty{text-align:center;color:var(--t3);padding:22px 10px;font-size:14px}
.empty svg{display:block;margin:0 auto 8px;color:#C3C9D3}
.act{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.act:first-of-type{border-top:0}.act i{width:6px;height:6px;border-radius:50%;background:var(--n);margin-top:7px;flex:0 0 6px}.act small{display:block;color:var(--t3);font-size:12px;margin-top:2px}
/* page */
.ph{padding:calc(18px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:flex-end;gap:10px}
.ph h2{flex:1;font-size:28px;font-weight:600;letter-spacing:-1px}
.ph h2 small{display:block;font-size:13px;color:var(--t3);font-weight:500;letter-spacing:0;margin-bottom:2px}
.ph .add{height:38px;padding:0 14px;border-radius:10px;background:var(--n);color:#fff;font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}
.srch{margin:0 16px 10px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;color:var(--t3)}
.srch input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--t)}
.chips{display:flex;gap:18px;overflow-x:auto;padding:0 16px;margin-bottom:6px;border-bottom:1px solid var(--line);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;font-weight:500;font-size:14px;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s}
.chip.on{color:var(--t);border-color:var(--n)}
.list{padding:6px 16px 0}
.grp{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;background:#fff;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row:active{background:#F8F9FB}
.list>.row{border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.av{width:40px;height:40px;border-radius:50%;background:#EEF0F4;color:var(--t2);display:grid;place-items:center;font-weight:600;font-size:13.5px;flex:0 0 40px;letter-spacing:.3px}
.av.t{background:#E7ECF7;color:var(--n)}.av.a{background:var(--n);color:#fff}.av.c{border-radius:10px;background:var(--n);color:#fff}
.row .in{flex:1;min-width:0}.row .in b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .in small{color:var(--t2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px}
.row .in small.mono{font-size:12px;color:var(--t3)}
.row>svg{color:#C3C9D3;flex:0 0 auto}
.tag{font-size:12px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--t2)}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.w{color:var(--warn)}.tag.g{color:var(--t3)}
.tag.nd:before{display:none}
.sec{color:var(--t3);font-weight:600;font-size:12px;letter-spacing:.6px;margin:18px 2px 8px;text-transform:uppercase}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#ffffffeb;backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--t3);padding:4px 0;transition:color .2s}
.nav button.on{color:var(--n)}
/* forms */
.ov{position:fixed;inset:0;background:#0B122066;z-index:60;opacity:0;pointer-events:none;transition:.3s}.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .4s cubic-bezier(.16,1,.3,1);padding:8px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grip{width:36px;height:4px;border-radius:2px;background:#DDE1E7;margin:0 auto 16px}
.sheet h3{font-size:22px;font-weight:600;letter-spacing:-.7px;margin-bottom:16px}
.f{display:block;margin-bottom:14px}.f>span{display:block;font-size:13px;font-weight:500;color:var(--t2);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;height:46px;border:1px solid #DADFE6;border-radius:10px;padding:0 12px;font-size:15.5px;outline:0;background:#fff;transition:border-color .2s,box-shadow .2s}
.f textarea{height:auto;padding:11px 12px;resize:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--n);box-shadow:0 0 0 3px #0F1E3D14}
.btn{width:100%;height:48px;border-radius:11px;background:var(--n);color:#fff;font-weight:500;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.5}
.btn.l{background:#fff;color:var(--t);border:1px solid #DADFE6}.btn.r{background:#fff;color:var(--bad);border:1px solid #F3C7CB}.btn.s{height:40px;font-size:14px;border-radius:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:#F1F3F6;border-radius:10px;padding:3px}.seg button{flex:1;height:36px;border-radius:8px;font-weight:500;font-size:13.5px;color:var(--t2)}.seg button.on{background:#fff;color:var(--t);box-shadow:0 1px 3px #0b122014}
.pick{display:flex;flex-wrap:wrap;gap:6px}.pick button{height:34px;padding:0 12px;border-radius:9px;border:1px solid #DADFE6;font-weight:500;font-size:13.5px;color:var(--t2)}.pick button.on{border-color:var(--n);background:var(--n);color:#fff}
.sch{display:grid;grid-template-columns:64px 1fr 1fr 30px;gap:6px;margin-bottom:6px}.sch select,.sch input{height:40px;border:1px solid #DADFE6;border-radius:9px;padding:0 8px;font-size:14px;background:#fff;min-width:0}
.sch button{color:var(--t3);font-size:20px}
.cred{background:var(--n);color:#fff;border-radius:14px;padding:18px;margin:2px 0 14px;position:relative;overflow:hidden}
.cred small{color:#9FB0CF;font-weight:500;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase}
.cred b{display:block;font-size:24px;font-weight:500;letter-spacing:2px;margin:4px 0 14px}
.cred p{font-size:13px;color:#AEBBD3;line-height:1.5;border-top:1px solid #ffffff1a;padding-top:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}.kv:first-child{border-top:0}.kv span{color:var(--t2)}.kv b{text-align:right;font-weight:500}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;background:var(--n);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
.login>*{position:relative;z-index:1}
.login .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.login .lg{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--n);display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden}
.login .lg img{width:100%;height:100%;object-fit:cover}
.login .eyb{margin-top:auto;font-size:12px;color:#9FB0CF;letter-spacing:1px;text-transform:uppercase;font-weight:500}
.login h1{font-size:38px;font-weight:600;letter-spacing:-1.6px;line-height:1.05;margin-top:10px}
.login p{color:#AEBBD3;margin-top:12px;line-height:1.55;font-size:15px}
.login .box{margin-top:28px}
.login .f>span{color:#AEBBD3}
.login .f input{background:#ffffff0d;border:1px solid #ffffff24;color:#fff;height:52px;font-size:17px;letter-spacing:1.5px;text-transform:uppercase;font-family:"Geist Mono",ui-monospace,monospace}
.login .f input::placeholder{color:#ffffff4d;letter-spacing:1px}
.login .f input:focus{border-color:#ffffffaa;box-shadow:0 0 0 3px #ffffff14}
.login .btn{background:#fff;color:var(--n);height:52px;font-weight:600}
.login .btn .spin{border-color:#0F1E3D33;border-top-color:var(--n)}
.login .note{color:#7F90B0;font-size:12.5px;margin-top:14px;line-height:1.5;text-align:center}
.err{background:#E02D3C1f;color:#FFB4BB;border:1px solid #E02D3C55;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;z-index:99;transition:.35s cubic-bezier(.16,1,.3,1);max-width:90%;text-align:center;font-size:14px}
.toast.on{transform:translate(-50%,0)}
.sk{background:linear-gradient(90deg,#ECEEF2 25%,#F5F6F8 50%,#ECEEF2 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px;border:0!important}@keyframes sk{to{background-position:-200% 0}}
.spin{width:20px;height:20px;border-radius:50%;border:2px solid #ffffff44;border-top-color:#fff;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.soon{display:flex;gap:10px;align-items:flex-start;color:var(--t2);border:1px dashed #D3D8E0;border-radius:14px;padding:14px;font-size:13.5px;line-height:1.5}
.soon svg{flex:0 0 auto;color:var(--t3);margin-top:1px}
.hero{display:flex;align-items:center;gap:14px;padding:4px 0 2px}
.hero .tm{font-size:34px;font-weight:600;letter-spacing:-1.4px;line-height:1}
.hero .tm small{display:block;font-size:12.5px;color:var(--t3);font-weight:500;letter-spacing:0;margin-top:6px}
.hero .in{flex:1;min-width:0;border-left:1px solid var(--line);padding-left:14px}.hero .in b{display:block;font-size:16px;font-weight:600;letter-spacing:-.3px}.hero .in small{display:block;color:var(--t2);font-size:13px;margin-top:2px}
</style>
</head>
<body>
<div id="view"></div>
<nav class="nav" id="nav" style="display:none"></nav>
<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
const TG = window.Telegram && Telegram.WebApp;
const BOT_ID = location.pathname.split('/').filter(Boolean)[1];
const $ = (q) => document.querySelector(q);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const I = (p, s = 22, w = 1.5) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ic = {
  home: I('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'), stu: I('<path d="M22 9 12 4 2 9l10 5 10-5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>'),
  tch: I('<circle cx="9" cy="7" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5S14.7 16.4 15.5 20"/><path d="M16 4h6v8h-6M16 8h3"/>'), cls: I('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4v5"/>'),
  user: I('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 4.6-6 8-6s6.4 2 8 6"/>'), bell: I('<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>', 20),
  plus: I('<path d="M12 5v14M5 12h14"/>', 18, 2.4), search: I('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', 20), copy: I('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>', 18),
  cal: I('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>', 20), lock: I('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', 20),
  chev: I('<path d="m9 6 6 6-6 6"/>', 18, 2), info: I('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>', 20),
};
const DAYS = ['Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba', 'Yakshanba'], DS = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
const ROLE = { admin: 'Administrator', teacher: "O‘qituvchi", student: "O‘quvchi" };
const ST = { active: ['Faol', 'ok'], blocked: ['Bloklangan', 'bad'], archived: ['Arxivda', 'g'] };
let C = null, ME = null, MYC = [], D = { users: [], classes: [] }, page = 'home', q = '', filt = 'all';
const hap = (t = 'light') => { try { TG.HapticFeedback.impactOccurred(t); } catch {} };
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); }
function openSheet() { $('#ov').classList.add('on'); $('#sheet').classList.add('on'); try { TG.BackButton.show(); } catch {} }
function closeSheet() { $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); try { TG.BackButton.hide(); } catch {} }
async function api(act, data = {}) {
  const r = await fetch(`/api/edu/${BOT_ID}/${act}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData: TG ? TG.initData : '', ...data }) });
  let d = {}; try { d = await r.json(); } catch {} if (!r.ok) throw new Error(d.error || 'Server bilan aloqa yo‘q. Qayta urinib ko‘ring'); return d;
}
const initials = (n) => String(n || '?').split(/\s+/).map((x) => x[0]).slice(0, 2).join('').toUpperCase();
const lg = () => (C && C.logo ? `<img src="${esc(C.logo)}" alt="">` : esc(initials(C ? C.name : '')));
function nowDay() { return (new Date().getDay() + 6) % 7; }
function nextLesson(classes) {
  const now = new Date(), d0 = nowDay(), mins = now.getHours() * 60 + now.getMinutes(); let best = null;
  for (const c of classes) for (const s of c.schedule || []) {
    const [h, m] = s.start.split(':').map(Number); let dd = (s.day - d0 + 7) % 7; if (dd === 0 && h * 60 + m < mins) dd = 7;
    const k = dd * 1440 + h * 60 + m; if (!best || k < best.k) best = { k, dd, c, s };
  }
  return best;
}
function whenTxt(n) { return n.dd === 0 ? 'Bugun' : n.dd === 1 ? 'Ertaga' : DAYS[n.s.day]; }
/* ---------- start ---------- */
async function boot() {
  try { TG.ready(); TG.expand(); TG.BackButton.onClick(closeSheet); TG.setHeaderColor('#0F1E3D'); TG.setBackgroundColor('#F5F7FB'); } catch {}
  $('#view').innerHTML = `<div class="login" style="align-items:center;justify-content:center"><div class="spin"></div></div>`;
  try { applyMe(await api('me')); } catch (e) { $('#view').innerHTML = `<div class="login"><h1>Ulanib bo‘lmadi</h1><p>${esc(e.message)}</p><button class="btn l" style="margin-top:24px" onclick="boot()">Qayta urinish</button></div>`; }
}
function applyMe(r) {
  C = r.center; document.documentElement.style.setProperty('--n', C.color || '#0F1E3D');
  if (!r.linked) return renderLogin();
  if (r.blocked) return renderBlocked();
  ME = r.me; MYC = r.classes || []; page = 'home'; render();
}
function renderLogin(errMsg) {
  $('#nav').style.display = 'none';
  $('#view').innerHTML = `<div class="login fade"><div class="brand"><div class="lg">${lg()}</div>${esc(C.name)}</div><div class="eyb">Ta’lim platformasi</div><h1>Shaxsiy<br>kabinet</h1><p>Shaxsiy ID va administrator bergan bir martalik aktivatsiya kodini kiriting.</p>
    <div class="box">${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ''}
      <label class="f"><span>Shaxsiy ID</span><input id="lid" placeholder="STU-1001" autocomplete="off" autocapitalize="characters"></label>
      <label class="f"><span>Aktivatsiya kodi</span><input id="lcode" placeholder="XXXX-XXXX" autocomplete="one-time-code" autocapitalize="characters" maxlength="12"></label>
      <button class="btn" id="lbtn" onclick="doLogin()">Davom etish</button>

async function classDel(id) { if (!confirm('Sinf o‘chirilsinmi? O‘quvchilar o‘chirilmaydi, faqat sinfdan chiqariladi.')) return; try { await api('class-delete', { id }); closeSheet(); toast('O‘chirildi'); renderClassesAdmin(); } catch (e) { toast(e.message); } }
/* ---------- O'QITUVCHI / O'QUVCHI ---------- */
function renderHome() {
  const n = nextLesson(MYC), isT = ME.role === 'teacher', today = MYC.flatMap((c) => (c.schedule || []).filter((s) => s.day === nowDay()).map((s) => ({ c, s }))).sort((a, b) => a.s.start.localeCompare(b.s.start));
  $('#view').innerHTML = header(`${greet()}, ${esc(ME.name.split(' ')[0])}`, isT ? `${MYC.length} ta sinf biriktirilgan` : MYC[0] ? `${esc(MYC[0].name)} · ${esc(MYC[0].teacherName || '')}` : 'Sinfga hali biriktirilmagansiz') + `<div class="wrap fade">
    <div class="card"><h3>Keyingi dars</h3>${n ? `<div class="hero"><div class="tm">${n.s.start}<small>${whenTxt(n)}</small></div><div class="in"><b>${esc(n.c.name)}</b><small>${esc(isT ? n.c.course || '' : n.c.teacherName || '')}${n.s.room || n.c.room ? ' · ' + esc(n.s.room || n.c.room) + '-xona' : ''} · ${n.s.start}–${n.s.end}</small></div></div>` : `<div class="empty">${ic.cal}Dars jadvali hali kiritilmagan</div>`}</div>
    ${isT ? `<div class="card"><h3>Bugungi darslar</h3>${today.length ? today.map(({ c, s }) => `<div class="les"><div class="tm">${s.start}<small>${s.end}</small></div><div class="bar"></div><div class="in"><b>${esc(c.name)}</b><small>${(c.students || []).length} o‘quvchi${s.room || c.room ? ' · ' + esc(s.room || c.room) + '-xona' : ''}</small></div></div>`).join('') : '<div class="empty">Bugun dars yo‘q</div>'}</div>` : ''}
    <div class="card"><h3>Yangi xabarlar</h3><div class="empty">${ic.bell}Yangi xabar yo‘q</div></div>
    <div class="soon">${ic.info}<span>Sinf chati, e’lonlar, uy vazifalari, baholar, davomat va to‘lovlar keyingi bosqichlarda qo‘shiladi.</span></div></div>`;
}
function renderMyClasses() {
  $('#view').innerHTML = `<div class="ph fade"><h2>${ME.role === 'teacher' ? 'Sinflarim' : 'Mening sinfim'}</h2></div><div class="list fade">${MYC.length ? MYC.map((c) => `<div class="card"><h3>${esc(c.name)}<span class="tag g">${esc(c.course || '')}</span></h3>
      <div class="kv"><span>O‘qituvchi</span><b>${esc(c.teacherName || '—')}</b></div><div class="kv"><span>Xona</span><b>${esc(c.room || '—')}</b></div>
      <div class="kv" style="display:block"><span>Dars jadvali</span>${(c.schedule || []).length ? (c.schedule || []).map((s) => `<div class="les"><div class="tm" style="width:90px;flex-basis:90px">${DAYS[s.day]}</div><div class="bar"></div><div class="in"><b>${s.start}–${s.end}</b>${s.room ? `<small>${esc(s.room)}-xona</small>` : ''}</div></div>`).join('') : '<p style="color:var(--t3);margin-top:6px">Kiritilmagan</p>'}</div>
      <div class="kv" style="display:block"><span>O‘quvchilar · ${(c.students || []).length}</span>${(c.students || []).map((s) => `<div class="row" style="box-shadow:none;border:1px solid var(--line);margin:8px 0 0"><div class="av" style="width:36px;height:36px;flex-basis:36px;border-radius:11px;font-size:13px">${esc(initials(s.name))}</div><div class="in"><b style="font-size:14px">${esc(s.name)}${s.id === ME.id ? ' (siz)' : ''}</b>${ME.role === 'teacher' ? `<small class="mono">${s.id}${s.phone ? ' · ' + esc(s.phone) : ''}</small>` : ''}</div></div>`).join('')}</div></div>`).join('')
    : `<div class="empty">${ic.cls}${ME.role === 'teacher' ? 'Sizga hali sinf biriktirilmagan' : 'Siz hali sinfga biriktirilmagansiz'}. Administratorga murojaat qiling.</div>`}</div>`;
}
function renderProfile() {
  const u = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user) || {};
  $('#view').innerHTML = `<div class="ph fade"><h2>Profil</h2></div><div class="list fade"><div class="card" style="text-align:center;padding:22px"><div class="av ${ME.role === 'teacher' ? 't' : ME.role === 'admin' ? 'a' : ''}" style="width:72px;height:72px;border-radius:22px;font-size:24px;margin:0 auto 12px">${esc(initials(ME.name))}</div><h3 style="justify-content:center;font-size:20px;margin-bottom:4px">${esc(ME.name)}</h3><span class="mono" style="color:var(--t2);font-weight:700">${ME.id}</span></div>
    <div class="card"><div class="kv"><span>Rol</span><b>${ROLE[ME.role]}</b></div><div class="kv"><span>O‘quv markazi</span><b>${esc(C.name)}</b></div><div class="kv"><span>Telefon</span><b>${esc(ME.phone || '—')}</b></div><div class="kv"><span>Telegram</span><b>${u.username ? '@' + esc(u.username) : '✓ bog‘langan'}</b></div><div class="kv"><span>Sinflar</span><b>${MYC.length}</b></div></div>
    <div class="soon">${ic.lock}<span>Kabinetingiz faqat shu Telegram akkauntga bog‘langan. Boshqa qurilmadan kirish uchun administrator yangi kod beradi.</span></div></div>`;
}
boot();
</script>
