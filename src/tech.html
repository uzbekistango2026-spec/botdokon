<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Maishiy texnika</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c:#FF5B14;--ink:#0B0B0F;--t2:#6B6F78;--t3:#A2A6AE;--bg:#FFFFFF;--soft:#F4F5F7;--line:#ECEDF0;--ok:#12A150;--bad:#E5383B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",Inter,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
img{display:block}
#view{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.fade{animation:fd .32s cubic-bezier(.16,1,.3,1)}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
svg{flex-shrink:0}
/* top */
.top{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .lg{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;overflow:hidden}
.top .lg img{width:100%;height:100%;object-fit:cover}
.top .nm{flex:1;min-width:0}.top .nm b{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .nm small{display:flex;align-items:center;gap:4px;color:var(--t2);font-size:12.5px;font-weight:500}
.ib{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;position:relative}
.ib i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--c);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.sbar{margin:2px 16px 14px;height:48px;border-radius:15px;background:var(--soft);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--t3);font-size:15px;width:calc(100% - 32px);text-align:left}
.sbar input{flex:1;border:0;outline:0;background:none;font-size:16px;color:var(--ink)}
/* banners */
.bn{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;scrollbar-width:none}.bn::-webkit-scrollbar{display:none}
.bn a{flex:0 0 calc(100% - 28px);scroll-snap-align:center;aspect-ratio:2/1;border-radius:20px;background-size:cover!important;box-shadow:0 14px 30px -18px #0007;position:relative;overflow:hidden;background:#111 center/cover;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.bn a.tx:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 20%,#000c)}
.bn a>*{position:relative}
.bn em{font-style:normal;align-self:flex-start;background:var(--c);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;margin-bottom:8px;letter-spacing:.2px}
.bn b{font-size:23px;font-weight:800;letter-spacing:-.8px;line-height:1.05}.bn span{font-size:13.5px;color:#ffffffcc;margin-top:4px}
.dots{display:flex;justify-content:center;gap:5px;margin:12px 0 0}.dots i{width:6px;height:6px;border-radius:3px;background:#D9DBE0;transition:.3s}.dots i.on{width:18px;background:var(--ink)}
/* sections */
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:22px 16px 12px}
.sh h2{font-size:21px;font-weight:800;letter-spacing:-.7px}.sh button{color:var(--t2);font-weight:600;font-size:14px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.cat{background:var(--soft) center/cover;border-radius:18px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;aspect-ratio:1/1.08;position:relative;overflow:hidden;color:#fff}
.cat:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#000b)}.cat>*{position:relative}
.cat b{font-size:12.5px;font-weight:700;letter-spacing:-.2px;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.cat .ci{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--ink)}
.cat small{position:absolute;right:8px;top:8px;background:#fffffff0;color:var(--ink);font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 7px}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.hs .pc{flex:0 0 46%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;padding:0 16px}
.pc{display:flex;flex-direction:column;text-align:left;position:relative;min-width:0}
.pc .imw{position:relative}.pc .im{width:100%;display:block;aspect-ratio:1;border-radius:18px;background:var(--soft) center/cover no-repeat;position:relative;overflow:hidden}
.pc .im.so{filter:grayscale(1);opacity:.55}
.pc .lb{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px}
.pc .lb.s{background:var(--c)}.pc .lb.l{background:#fff;color:var(--ink)}
.pc .cmp{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:11px;background:#ffffffe6;backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--ink)}
.pc .cmp.on{background:var(--ink);color:#fff}
.pc .add{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px #0008;transition:transform .15s}
.pc .add:active{transform:scale(.9)}.pc .add.in{background:var(--c)}
.pc .pr{margin-top:9px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pc .pr b{font-size:16.5px;font-weight:800;letter-spacing:-.4px}.pc .pr s{color:var(--t3);font-size:12.5px}
.pc .mo{display:inline-flex;align-self:flex-start;margin-top:4px;background:#FFF1EA;color:#C2410C;font-size:12px;font-weight:600;padding:3px 7px;border-radius:7px}
.pc .nm{font-size:14px;font-weight:500;line-height:1.3;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .rt{display:flex;align-items:center;gap:4px;color:var(--t2);font-size:12.5px;margin-top:4px}.pc .rt svg{color:#FFB300}
.pc .lf{color:var(--bad);font-size:12px;font-weight:600;margin-top:3px}
.adv{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 16px 0;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.adv div{padding:13px 10px;display:flex;flex-direction:column;gap:3px;border-left:1px solid var(--line)}.adv div:first-child{border-left:0}
.adv svg{width:20px;height:20px;margin-bottom:6px;color:var(--c)}.adv b{font-size:13px;font-weight:700;letter-spacing:-.2px}.adv small{font-size:11.5px;color:var(--t2)}
.promo{margin:22px 16px 0;border-radius:22px;background:var(--ink);color:#fff;padding:18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;text-align:left;width:calc(100% - 32px)}
.promo:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--c),#0000 70%);opacity:.55}
.promo .pi{width:52px;height:52px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-weight:800;font-size:17px;position:relative;z-index:1}
.promo div{flex:1;position:relative;z-index:1}.promo b{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px}.promo small{color:#ffffffaa;font-size:13px}
.brands{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}.brands::-webkit-scrollbar{display:none}
.brands button{flex:0 0 auto;height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);font-weight:700;font-size:15px;letter-spacing:-.2px}
/* page head */
.ph{position:sticky;top:0;z-index:30;background:#ffffffee;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px}
.ph h1{flex:1;font-size:20px;font-weight:800;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.big h1{font-size:28px;letter-spacing:-1px;padding-left:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 15px;border-radius:12px;background:var(--soft);font-weight:600;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff}
.chip i{font-style:normal;background:var(--c);color:#fff;border-radius:7px;font-size:11px;padding:1px 6px}
.tools{display:flex;gap:8px;padding:0 16px 14px}
.tools button,.tools select{height:40px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;background:#fff;appearance:none;-webkit-appearance:none}
.tools select{flex:1;min-width:0}
.cnt{padding:0 16px 12px;color:var(--t2);font-size:13.5px}
/* product */
.gal{position:relative;background:var(--soft)}
.gal .sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gal .sl::-webkit-scrollbar{display:none}
.gal .sl div{flex:0 0 100%;aspect-ratio:1/0.92;background:center/cover no-repeat;scroll-snap-align:center}
.gal .bk{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;z-index:2;background:#ffffffe6;backdrop-filter:blur(10px)}
.gal .bk2{left:auto;right:12px}
.pb{padding:18px 16px 0}
.pb .br{color:var(--t2);font-weight:600;font-size:13px;letter-spacing:.4px;text-transform:uppercase}
.pb h1{font-size:23px;font-weight:700;letter-spacing:-.7px;line-height:1.2;margin-top:4px}
.pb .rt{display:flex;gap:10px;align-items:center;color:var(--t2);font-size:13.5px;margin-top:8px}.pb .rt b{color:var(--ink);display:flex;align-items:center;gap:3px}.pb .rt b svg{color:#FFB300}
.pp{display:flex;align-items:baseline;gap:10px;margin-top:14px;flex-wrap:wrap}
.pp b{font-size:30px;font-weight:800;letter-spacing:-1.2px}.pp s{color:var(--t3);font-size:16px}.pp em{font-style:normal;background:var(--c);color:#fff;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:8px;align-self:center}
.kc{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.kc span{background:var(--soft);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600}
.box{border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 16px 0}
.box h3{font-size:16.5px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.box p{color:var(--t2);font-size:14px;line-height:1.5;margin-top:6px}
.mseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.mseg button{height:52px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;line-height:1.1;transition:.2s}
.mseg button small{font-size:11px;font-weight:500;color:var(--t2)}.mseg button.on{background:var(--ink);color:#fff}.mseg button.on small{color:#ffffffaa}
.calc{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;gap:10px}
.calc b{font-size:26px;font-weight:800;letter-spacing:-1px}.calc b small{font-size:14px;font-weight:600;color:var(--t2);letter-spacing:0}
.calc div:last-child{text-align:right;color:var(--t2);font-size:12.5px;line-height:1.5}
.info{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.info:first-of-type{border-top:0;padding-top:4px}
.info i{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;flex:0 0 40px}
.info b{font-size:14.5px;font-weight:600}.info small{display:block;color:var(--t2);font-size:13px;line-height:1.45;margin-top:2px}
.spec{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.spec:first-of-type{border-top:0}
.spec span{color:var(--t2)}.spec b{font-weight:600;text-align:right}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#ffffffee;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.btn{height:54px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;transition:transform .15s,opacity .2s;padding:0 16px}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45}
.btn.c{background:var(--c)}.btn.l{background:var(--soft);color:var(--ink)}
.btn small{font-weight:500;opacity:.75;font-size:13px}
.qn{display:flex;align-items:center;background:var(--soft);border-radius:16px;height:54px}.qn button{width:46px;height:54px;font-size:22px;font-weight:500}.qn b{min-width:22px;text-align:center;font-size:16px}
.ib.cmpb.on{background:var(--ink);color:#fff}
/* compare */
.cw{overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.cw::-webkit-scrollbar{display:none}
.ct{display:grid;gap:0 10px}
.ct .hd{position:relative}
.ct .hd .im{aspect-ratio:1;border-radius:16px;background:var(--soft) center/cover}
.ct .hd b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;margin-top:8px;height:35px;overflow:hidden}
.ct .hd .p{font-size:16px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.ct .hd .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:9px;background:#ffffffe6;display:grid;place-items:center}
.ct .rl{grid-column:1/-1;color:var(--t2);font-size:12px;font-weight:600;padding:14px 0 4px;text-transform:uppercase;letter-spacing:.4px;position:sticky;left:0}
.ct .v{font-size:14px;font-weight:500;padding-bottom:12px;border-bottom:1px solid var(--line);line-height:1.35}
.ct .v.df{color:var(--ink);font-weight:700}
.tg2{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px;font-weight:600;font-size:14px}
.sw{width:46px;height:28px;border-radius:14px;background:#D9DBE0;position:relative;transition:.2s}.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}.sw.on{background:var(--ink)}.sw.on:after{left:21px}
/* cart */
.ln{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ln .im{width:84px;height:84px;border-radius:16px;background:var(--soft) center/cover;flex:0 0 84px}
.ln .in{flex:1;min-width:0;display:flex;flex-direction:column}
.ln .in b{font-size:14.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ln .in small{color:var(--t2);font-size:12.5px;margin-top:3px}
.ln .rw{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.ln .rw .p{font-weight:800;font-size:16px;letter-spacing:-.3px}
.ln .q{display:flex;align-items:center;background:var(--soft);border-radius:11px;height:36px}.ln .q button{width:34px;height:36px;font-size:18px}.ln .q b{min-width:18px;text-align:center;font-size:14px}
.sum{margin:16px;background:var(--soft);border-radius:20px;padding:16px}
.sum .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px;color:var(--t2)}.sum .r span:last-child{color:var(--ink);font-weight:600}
.sum .r.t{border-top:1px solid #E1E3E8;margin-top:6px;padding-top:12px;font-size:17px;color:var(--ink);font-weight:800}.sum .r.t span:last-child{font-weight:800}
.sum .r.g span:last-child{color:var(--ok)}
/* forms */
.fs{padding:0 16px}
.f{display:block;margin-bottom:14px}.f>span{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:7px}
.f input{width:100%;height:52px;border:0;border-radius:15px;padding:0 15px;font-size:16px;outline:0;background:var(--soft);transition:box-shadow .2s}
.f input:focus{box-shadow:0 0 0 2px var(--ink) inset;background:#fff}
.seg{display:flex;background:var(--soft);border-radius:15px;padding:4px;gap:4px}.seg button{flex:1;min-height:46px;border-radius:12px;font-weight:600;font-size:14px;color:var(--t2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}.seg button small{font-size:11.5px;font-weight:500}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0b0b0f14}
.locb{width:100%;display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:15px;padding:12px 14px;text-align:left}
.locb>svg{width:40px;height:40px;padding:9px;border-radius:12px;background:var(--ink);color:#fff}
.locb span{display:flex;flex-direction:column;font-weight:600}.locb small{color:var(--t2);font-weight:500;font-size:12.5px;margin-top:2px}
.locb.ok>svg{background:var(--ok)}.locb.no>svg{background:var(--bad)}
/* misc */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#ffffffee;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--t3);padding:4px 0;position:relative}
.nav button.on{color:var(--ink)}
.nav button i{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--c);color:#fff;font-size:10.5px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px}
.ov{position:fixed;inset:0;background:#0b0b0f66;z-index:60;opacity:0;pointer-events:none;transition:.3s}.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:24px 24px 0 0;max-height:90vh;overflow-y:auto;transform:translateY(105%);transition:transform .4s cubic-bezier(.16,1,.3,1);padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grip{width:38px;height:4px;border-radius:2px;background:#DDDFE3;margin:0 auto 14px}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.7px;margin-bottom:14px}
.sheet .lbl{font-size:13px;font-weight:600;color:var(--t2);margin:16px 0 8px}
.pk{display:flex;flex-wrap:wrap;gap:6px}.pk button{height:40px;padding:0 14px;border-radius:12px;background:var(--soft);font-weight:600;font-size:14px}.pk button.on{background:var(--ink);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--t2);padding:80px 30px 20px;line-height:1.5}
.empty svg{display:block;margin:0 auto 14px;color:#C9CCD2}
.empty h3{color:var(--ink);font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.empty .btn{margin:22px auto 0;max-width:240px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;z-index:99;transition:.35s cubic-bezier(.16,1,.3,1);max-width:90%;text-align:center;font-size:14px;display:flex;gap:8px;align-items:center}
.toast.on{transform:translate(-50%,0)}
.cbar{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:39;background:var(--ink);color:#fff;border-radius:16px;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;font-weight:600;font-size:14px;box-shadow:0 10px 30px -10px #000a;transform:translateY(150%);transition:transform .35s cubic-bezier(.16,1,.3,1)}
.cbar.on{transform:none}.cbar button{background:#fff;color:var(--ink);height:38px;border-radius:11px;padding:0 14px;font-weight:700;font-size:13.5px}

  ret: I('<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6"/>', 20), tool: I('<path d="M14.5 6.5a4 4 0 0 0 5 5L21 13l-8 8-2-2 6.5-6.5M9.5 17.5 3 11l8-8 1.5 1.5"/>', 20), share: I('<path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/>', 20),
};
const CI = { tel: '<rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>', muz: '<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 10h14M8.5 6v1.5M8.5 13v3"/>', kir: '<rect x="4" y="2.5" width="16" height="19" rx="2.5"/><circle cx="12" cy="13" r="4.5"/><path d="M4 7h16M7 4.8h.01M9.5 4.8h.01"/>', kon: '<rect x="2.5" y="5" width="19" height="8" rx="2"/><path d="M6 10h12M7 16c0 1.5-1 2.5-1 2.5M12 16v3M17 16c0 1.5 1 2.5 1 2.5"/>', cha: '<path d="M14 3v11M14 14l-6 5H5a2 2 0 0 1 0-4h5l4-1z"/><circle cx="17" cy="19" r="2"/>', mik: '<rect x="2.5" y="5" width="19" height="14" rx="2"/><rect x="5.5" y="8" width="10" height="8" rx="1"/><path d="M18.5 9h.01M18.5 12h.01M18.5 15h.01"/>' };

let S = null, page = 'home', stack = [], favs = LS('favs', []), cart = LS('cart', []), cmp = LS('cmp', []), me = LS('me', {}), geo = LS('geo', null), recent = LS('recent', []);

function closeSheet() { $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); if (!stack.length) try { TG.BackButton.hide(); } catch {} }
function show(p, push) { if (push) stack.push(page); else stack = []; page = p; scrollTo(0, 0); render(); try { stack.length ? TG.BackButton.show() : TG.BackButton.hide(); } catch {} }

function render() { clearInterval(bnT); try { TG.setHeaderColor(page === 'home' ? '#6A00F2' : '#ffffff'); } catch {} ({ home: renderHome, favs: renderFavs, catalog: renderCat, search: renderSearch, prod: renderProd, compare: renderCmp, cart: renderCart, checkout: renderCheckout, profile: renderProfile })[page](); renderNav(); }
const cartN = () => cart.reduce((a, x) => a + x.qty, 0);

/* ---------- kartochka ---------- */

      <div class="f"><span>Manzil</span><input id="ca" value="${esc(me.address || '')}" placeholder="Ko‘cha, uy, xonadon, qavat"></div>`}
    <div class="f"><span>Izoh</span><input id="cc" placeholder="Masalan: lift yo‘q, 4-qavat"></div>
    <div class="f"><span>To‘lov usuli</span><div class="seg"><button class="${pay === 'cash' ? 'on' : ''}" onclick="saveMe();pay='cash';renderCheckout()">Naqd</button><button class="${pay === 'card' ? 'on' : ''}" onclick="saveMe();pay='card';renderCheckout()">Karta</button>${P.length ? `<button class="${pay === 'installment' ? 'on' : ''}" onclick="saveMe();pay='installment';renderCheckout()">Bo‘lib</button>` : ''}</div></div>
    ${pay === 'installment' ? `<div class="box" style="margin:0 0 14px"><h3>${ic.card}Muddatni tanlang</h3><div class="mseg">${P.map((x) => `<button class="${pl.m === x.m ? 'on' : ''}" onclick="saveMe();months=${x.m};renderCheckout()">${x.m}<small>${x.p ? '+' + x.p + '%' : '0%'}</small></button>`).join('')}</div>
      <div class="calc"><div><small style="color:var(--t2);font-size:13px;display:block">Har oy</small><b>${fmt(monthly(tot, pl)).replace(' so‘m', '')}<small> so‘m</small></b></div><div>Jami: <b style="color:var(--ink)">${fmt(monthly(tot, pl) * pl.m)}</b><br>Pasport va karta kerak bo‘ladi</div></div></div>` : ''}
    <div class="sum" style="margin:6px 0 0"><div class="r"><span>Mahsulotlar (${cartN()})</span><span>${fmt(sub)}</span></div><div class="r ${fee ? '' : 'g'}"><span>${pickup ? 'Olib ketish' : 'Yetkazib berish'}</span><span>${fee ? fmt(fee) : 'Bepul'}</span></div><div class="r t"><span>Jami</span><span>${fmt(tot)}</span></div></div>
    <div style="height:110px"></div></div>
    <div class="foot"><button class="btn c" id="ob" onclick="order()">Buyurtma berish<small>· ${pay === 'installment' ? fmt(monthly(tot, pl)) + '/oy' : fmt(tot)}</small></button></div>`;
}
function saveMe() { const g = (id) => ($(id) || {}).value; me = { name: (g('#cn') ?? me.name ?? '').trim(), phone: (g('#cp') ?? me.phone ?? '').trim(), address: (g('#ca') ?? me.address ?? '').trim() }; SS('me', me); }
function sendLoc() {
  saveMe(); hap('medium'); const b = $('#lb'); b.className = 'locb'; b.querySelector('span').innerHTML = 'Aniqlanmoqda…<small>Bir necha soniya</small>';
  const done = async (la, ln) => { geo = { lat: +la.toFixed(6), lng: +ln.toFixed(6) }; SS('geo', geo); b.className = 'locb ok'; b.querySelector('span').innerHTML = 'Joylashuv aniqlandi ✓<small>Qayta bosib yangilashingiz mumkin</small>';
    try { const d = await (await fetch(`/api/geo/rev?lat=${geo.lat}&lng=${geo.lng}`)).json(); if (d.line) { const a = $('#ca'); if (a && !a.value.trim()) { a.value = d.line; saveMe(); } } } catch {} };
  const fail = (st) => { b.className = 'locb no'; b.querySelector('span').innerHTML = 'Joylashuv o‘chiq<small>GPS’ni yoqing va qayta bosing</small>'; const LM = TG && TG.LocationManager; if (st && LM && LM.openSettings) try { LM.openSettings(); } catch {} };
  const nav = () => (navigator.geolocation ? navigator.geolocation.getCurrentPosition((p) => done(p.coords.latitude, p.coords.longitude), () => fail(), { enableHighAccuracy: true, timeout: 15000 }) : fail());
  const LM = TG && TG.LocationManager;
  if (LM && LM.init) { try { LM.init(() => { if (!LM.isLocationAvailable) return nav(); LM.getLocation((d) => (d && d.latitude ? done(d.latitude, d.longitude) : fail(LM.isAccessRequested && !LM.isAccessGranted))); }); return; } catch {} }
  nav();
}
async function order() {
  saveMe(); if (!me.name || me.phone.replace(/\D/g, '').length < 9) return toast('Ism va telefonni to‘liq yozing');
  if (!pickup && !geo) { toast('Joylashuvni yuboring'); $('#lb').animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 300 }); return; }
  if (!pickup && !me.address) return toast('Manzilni yozing');
  const b = $('#ob'); b.disabled = true; b.innerHTML = 'Yuborilmoqda…';
  try {
    const r = await fetch(`/api/shop/${BOT_ID}/order`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData: TG ? TG.initData : '', items: cart.map((x) => ({ id: x.id, qty: x.qty })), payment: pay, months, pickup, customer: { name: me.name, phone: me.phone, address: pickup ? '-' : me.address, comment: ($('#cc') || {}).value || '', location: pickup ? null : geo } }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Xatolik');
    cart = []; SS('cart', cart); try { TG.HapticFeedback.notificationOccurred('success'); } catch {}
    try { const s2 = await (await fetch('/api/shop/' + BOT_ID)).json(); S.products = s2.products; } catch {}
    stack = []; page = 'profile'; renderNav(); $('#nav').style.display = '';
    $('#view').innerHTML = `<div class="empty fade" style="padding-top:110px">${I('<circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/>', 68, 1.2).replace('currentColor', '#12A150')}<h3>Buyurtma #${d.number} qabul qilindi</h3>Menejer 15 daqiqa ichida qo‘ng‘iroq qilib, tafsilotlarni tasdiqlaydi. Holatini shu botda xabar qilamiz.<button class="btn" onclick="show('profile')">Buyurtmalarim</button></div>`;
  } catch (e) { try { TG.HapticFeedback.notificationOccurred('error'); } catch {} toast(e.message); b.disabled = false; b.innerHTML = 'Buyurtma berish'; }
}
/* ---------- profil ---------- */
async function renderProfile() {
  const u = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user) || {}, s = S.settings;
  $('#view').innerHTML = `<div class="ph big"><h1>Profil</h1></div>
    <div style="padding:2px 16px 18px;display:flex;gap:14px;align-items:center"><div style="width:60px;height:60px;border-radius:20px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700">${esc((u.first_name || me.name || 'M')[0])}</div><div><b style="font-size:19px;letter-spacing:-.4px">${esc([u.first_name, u.last_name].filter(Boolean).join(' ') || me.name || 'Mehmon')}</b><div style="color:var(--t2)">${esc(me.phone || (u.username ? '@' + u.username : ''))}</div></div></div>
    <div class="sh" style="padding-top:4px"><h2>Buyurtmalarim</h2></div><div id="ol"><div class="oc sk" style="height:96px;border:0"></div></div>
    <div class="box"><div class="info"><i>${ic.shield}</i><div><b>Kafolat</b><small>${esc(s.warrantyInfo || 'Barcha mahsulotlarga rasmiy kafolat.')}</small></div></div><div class="info"><i>${ic.truck}</i><div><b>Yetkazib berish</b><small>${esc(s.deliveryInfo || 'Tez yetkazib beramiz.')}</small></div></div>${hasPl() ? `<div class="info"><i>${ic.card}</i><div><b>Bo‘lib to‘lash</b><small>${plans().map((x) => `${x.m} oy — ${x.p ? '+' + x.p + '%' : '0%'}`).join(' · ')}</small></div></div>` : ''}
      ${s.phone || s.address ? `<div class="info"><i>${ic.store}</i><div><b>Aloqa</b><small>${s.phone ? esc(s.phone) + '<br>' : ''}${esc(s.address || '')}${s.workHours ? '<br>' + esc(s.workHours) : ''}</small></div></div>` : ''}</div><div style="height:20px"></div>`;
  try {
    const a = await (await fetch(`/api/shop/${BOT_ID}/orders`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData: TG ? TG.initData : '' }) })).json();
    const el = $('#ol'); if (!el) return;
    el.innerHTML = Array.isArray(a) && a.length ? a.map((o) => `<div class="oc"><div class="h"><b>#${o.number}</b><em>${esc(o.statusText)}</em></div><p style="color:var(--t2);font-size:14px;margin:8px 0;line-height:1.5">${o.items.map((i) => `${esc(i.name)} × ${i.qty}`).join('<br>')}</p><div class="h"><small style="color:var(--t3)">${new Date(o.createdAt).toLocaleDateString('ru-RU')}</small><b>${o.installment ? fmt(o.installment.monthly) + ' × ' + o.installment.months + ' oy' : fmt(o.total)}</b></div></div>`).join('') : '<p class="cnt">Hali buyurtma yo‘q</p>';
  } catch { const el = $('#ol'); if (el) el.innerHTML = '<p class="cnt">Yuklab bo‘lmadi</p>'; }
}
/* ---------- start ---------- */
async function init() {
  try { TG.ready(); TG.expand(); TG.BackButton.onClick(back); TG.setHeaderColor('#6A00F2'); TG.setBackgroundColor('#ffffff'); } catch {}
  $('#view').innerHTML = `<div style="padding:60px 16px"><div class="sk" style="height:48px;border-radius:15px"></div><div class="sk" style="height:176px;border-radius:22px;margin-top:14px"></div><div class="grid" style="padding:0;margin-top:18px">${'<div class="sk" style="aspect-ratio:1;border-radius:18px"></div>'.repeat(4)}</div></div>`;
  try { const r = await fetch('/api/shop/' + BOT_ID); if (!r.ok) throw 0; S = await r.json(); }
  catch { $('#view').innerHTML = '<div class="empty"><h3>Yuklanmadi</h3>Internetni tekshirib, qayta oching<button class="btn" onclick="init()">Qayta urinish</button></div>'; return; }
  if (HM()) document.body.classList.add('hm');
  if (S.settings.color && !['#7000FF', '#0E7C66'].includes(S.settings.color)) document.documentElement.style.setProperty('--c', S.settings.color);
  document.title = S.settings.shopName || (HM() ? 'Uy-ro‘zg‘or' : 'Maishiy texnika');
  cart = cart.filter((x) => S.products.some((p) => p.id === x.id)); cmp = cmp.filter((id) => S.products.some((p) => p.id === id));
  const sp = new URLSearchParams(location.search).get('p') || (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param);
  render(); if (sp && S.products.find((p) => p.id === sp)) openP(sp);
}
init();
</script>
</body>
</html>
