name: imgs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p menu/realty
          while read name id; do
            [ -z "$name" ] && continue
            curl -sL -o "menu/realty/$name.jpg" "https://images.unsplash.com/$id?w=1200&q=78&fm=jpg&fit=crop&crop=entropy"
            s=$(stat -c%s "menu/realty/$name.jpg"); t=$(file -b --mime-type "menu/realty/$name.jpg")
            if [ "$s" -lt 20000 ] || [ "$t" != "image/jpeg" ]; then echo "BAD $name $s $t"; rm -f "menu/realty/$name.jpg"; else echo "OK $name $s"; fi
          done <<'LIST'
          ext1 photo-1568605114967-8130f3a36994
          ext2 photo-1570129477492-45c003edd2be
          ext3 photo-1512917774080-9991f1c4c750
          ext4 photo-1580587771525-78b9dba3b914
          ext5 photo-1600596542815-ffad4c1539a9
          ext6 photo-1600585154340-be6161a56a0c
          ext7 photo-1449844908441-8829872d2607
          ext8 photo-1605276374104-dee2a0ed3cd6
          bld1 photo-1545324418-cc1a3fa10c00
          bld2 photo-1486406146926-c627a92ad1ab
          bld3 photo-1460317442991-0ec209397118
          int1 photo-1560448204-e02f11c3d0e2
          int2 photo-1502672260266-1c1ef2d93688
          int3 photo-1522708323590-d24dbb6b0267
          int4 photo-1600607687939-ce8a6c25118c
          int5 photo-1484154218962-a197022b5858
          int6 photo-1493809842364-78817add7ffb
          int7 photo-1586023492125-27b2c045efd7
          int8 photo-1616594039964-ae9021a400a0
          int9 photo-1556909114-f6e7ad7d3136
          bed1 photo-1505693416388-ac5ce068fe85
          bed2 photo-1540518614846-7eded433c457
          off1 photo-1497366216548-37526070297c
          off2 photo-1497366811353-6870744d04b2
          shp1 photo-1441986300917-64674bd600d8
          land1 photo-1500382017468-9049fed747ef
          land2 photo-1464226184884-fa280b87c399
