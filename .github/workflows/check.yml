name: check
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd menu/grocery && python3 fetch.py
          cd ../.. && git add menu/grocery && git -c user.name=bot -c user.email=bot@x commit -qm "Oziq-ovqat katalogi rasmlari (Open Food Facts)" && git pull -q --rebase && git push -q
