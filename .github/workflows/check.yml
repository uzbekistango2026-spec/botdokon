name: check
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s https://botdokon.oltinshoh2026.workers.dev/api/pubkey; echo; exit 0
          cd menu/fashion
          while read k id; do curl -sf -o "$k.jpg" "https://images.unsplash.com/photo-$id?w=1000&q=78&auto=format&fm=jpg&fit=crop" || echo "MISS $k"; done < ids.txt
          ls *.jpg | wc -l
          cd ../.. && git add menu/fashion && git -c user.name=bot -c user.email=bot@x commit -qm "Kiyim do'koni demo rasmlari (Unsplash)" && git push -q
